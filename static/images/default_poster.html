<!DOCTYPE html>
<html>
<head>
    <title>默认海报</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .poster {
            width: 300px;
            height: 450px;
            background-color: #34495e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ecf0f1;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #bdc3c7;
            margin-top: 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="poster">
        <h1>暂无海报</h1>
        <p>No Poster Available</p>
    </div>
</body>
</html>
