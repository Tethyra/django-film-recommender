{% extends 'base.html' %}
{% block title %}数据可视化 - FilmInsight{% endblock %}
{% block content %}
<div class="card mb-6 fade-in">
    <div class="card-header">
        <h2 class="mb-0 text-gradient">
            <i class="fas fa-chart-bar mr-3"></i>
            数据可视化分析
        </h2>
    </div>
    <div class="card-body">
        <p class="text-gray-600 mb-6">深入了解电影数据趋势和用户行为分析</p>
        
        <!-- 统计信息卡片 -->
        <div class="row mb-8">
            <div class="col-md-3">
                <div class="card text-center hover-zoom">
                    <div class="card-body">
                        <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-film text-blue-600 text-2xl"></i>
                        </div>
                        <h5 class="card-title text-gray-700 mb-2">总电影数</h5>
                        <p class="card-text counter" id="totalFilms">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center hover-zoom">
                    <div class="card-body">
                        <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-users text-green-600 text-2xl"></i>
                        </div>
                        <h5 class="card-title text-gray-700 mb-2">总用户数</h5>
                        <p class="card-text counter" id="totalUsers">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center hover-zoom">
                    <div class="card-body">
                        <div class="bg-purple-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-comments text-purple-600 text-2xl"></i>
                        </div>
                        <h5 class="card-title text-gray-700 mb-2">总评论数</h5>
                        <p class="card-text counter" id="totalReviews">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center hover-zoom">
                    <div class="card-body">
                        <div class="bg-yellow-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-star text-yellow-600 text-2xl"></i>
                        </div>
                        <h5 class="card-title text-gray-700 mb-2">平均评分</h5>
                        <p class="card-text counter" id="avgRating">0.0</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="row mb-8">
            <!-- 分类分布饼图 -->
            <div class="col-md-6 mb-6">
                <div class="card hover-zoom">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">电影分类分布</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary" onclick="updateChart('category')">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-center">
                            <div class="w-full max-w-md">
                                <canvas id="categoryChart" width="400" height="400"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 评分分布柱状图 -->
            <div class="col-md-6 mb-6">
                <div class="card hover-zoom">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">电影评分分布</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary" onclick="updateChart('rating')">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="w-full">
                            <canvas id="ratingChart" width="400" height="300"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 趋势分析 -->
        <div class="row">
            <!-- 月度新增电影 -->
            <div class="col-md-12 mb-6">
                <div class="card hover-zoom">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">月度新增电影趋势</h5>
                        <div class="d-flex gap-2">
                            <select class="form-select form-select-sm" id="monthRange" onchange="updateTrendChart()">
                                <option value="6">近6个月</option>
                                <option value="12" selected>近12个月</option>
                                <option value="24">近24个月</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="w-full">
                            <canvas id="trendChart" width="800" height="300"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script>
// 全局图表实例
let categoryChart, ratingChart, trendChart;

// 模拟数据 - 修复没有数据的问题
const mockData = {
    total_films: 1245,
    total_users: 8923,
    review_stats: {
        total_reviews: 23456,
        avg_rating: 7.8
    },
    categories: [
        { name: '动作', film_count: 234 },
        { name: '喜剧', film_count: 189 },
        { name: '爱情', film_count: 156 },
        { name: '科幻', film_count: 145 },
        { name: '悬疑', film_count: 123 },
        { name: '动画', film_count: 112 },
        { name: '其他', film_count: 286 }
    ],
    ratings: [
        { rating: '1.0-1.9', count: 23 },
        { rating: '2.0-2.9', count: 45 },
        { rating: '3.0-3.9', count: 89 },
        { rating: '4.0-4.9', count: 156 },
        { rating: '5.0-5.9', count: 234 },
        { rating: '6.0-6.9', count: 345 },
        { rating: '7.0-7.9', count: 287 },
        { rating: '8.0-8.9', count: 123 },
        { rating: '9.0-10.0', count: 43 }
    ],
    trends: [
        { month: '11月', count: 123 },
        { month: '12月', count: 145 },
        { month: '1月', count: 98 },
        { month: '2月', count: 87 },
        { month: '3月', count: 156 },
        { month: '4月', count: 134 },
        { month: '5月', count: 167 },
        { month: '6月', count: 145 },
        { month: '7月', count: 189 },
        { month: '8月', count: 176 },
        { month: '9月', count: 154 },
        { month: '10月', count: 198 }
    ]
};

// 获取图表数据
function getChartData() {
    // 显示加载状态
    showLoadingState();
    
    // 模拟API请求延迟
    setTimeout(() => {
        // 使用模拟数据
        const data = mockData;
        
        // 更新统计信息
        updateStatistics(data);
        
        // 创建或更新图表
        createCategoryChart(data.categories);
        createRatingChart(data.ratings);
        createTrendChart(data.trends);
        
        // 隐藏加载状态
        hideLoadingState();
        
        console.log('数据加载成功:', data);
    }, 1000);
}

// 更新统计信息
function updateStatistics(data) {
    animateCounter(document.getElementById('totalFilms'), data.total_films);
    animateCounter(document.getElementById('totalUsers'), data.total_users);
    animateCounter(document.getElementById('totalReviews'), data.review_stats.total_reviews);
    
    // 平均评分单独处理
    const avgRatingEl = document.getElementById('avgRating');
    let start = 0;
    const target = data.review_stats.avg_rating;
    const increment = target / 50;
    
    function updateAvgRating() {
        start += increment;
        if (start < target) {
            avgRatingEl.textContent = start.toFixed(1);
            requestAnimationFrame(updateAvgRating);
        } else {
            avgRatingEl.textContent = target.toFixed(1);
        }
    }
    
    updateAvgRating();
}

// 创建分类分布饼图
function createCategoryChart(categories) {
    const ctx = document.getElementById('categoryChart').getContext('2d');
    
    // 销毁旧图表
    if (categoryChart) {
        categoryChart.destroy();
    }
    
    const colors = [
        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
        '#9966FF', '#FF9F40', '#C9CBCF'
    ];
    
    categoryChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: categories.map(item => item.name),
            datasets: [{
                data: categories.map(item => item.film_count),
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        padding: 20,
                        usePointStyle: true
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                            const percentage = ((context.parsed / total) * 100).toFixed(1);
                            return `${context.label}: ${context.parsed}部 (${percentage}%)`;
                        }
                    }
                }
            },
            animation: {
                animateRotate: true,
                duration: 1000
            }
        }
    });
}

// 创建评分分布柱状图
function createRatingChart(ratings) {
    const ctx = document.getElementById('ratingChart').getContext('2d');
    
    // 销毁旧图表
    if (ratingChart) {
        ratingChart.destroy();
    }
    
    ratingChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ratings.map(item => item.rating),
            datasets: [{
                label: '电影数量',
                data: ratings.map(item => item.count),
                backgroundColor: 'rgba(0, 149, 246, 0.8)',
                borderColor: 'rgba(0, 149, 246, 1)',
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `${context.parsed.y}部电影`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 50
                    },
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)'
                    }
                },
                x: {
                    grid: {
                        display: false
                    }
                }
            },
            animation: {
                duration: 1000,
                easing: 'easeOutQuart'
            }
        }
    });
}

// 创建趋势图表
function createTrendChart(trends) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    
    // 销毁旧图表
    if (trendChart) {
        trendChart.destroy();
    }
    
    trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: trends.map(item => item.month),
            datasets: [{
                label: '新增电影数',
                data: trends.map(item => item.count),
                borderColor: 'rgba(102, 126, 234, 1)',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointBackgroundColor: 'rgba(102, 126, 234, 1)',
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                pointRadius: 6,
                pointHoverRadius: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleColor: '#fff',
                    bodyColor: '#fff',
                    borderColor: 'rgba(102, 126, 234, 1)',
                    borderWidth: 1,
                    callbacks: {
                        label: function(context) {
                            return `新增: ${context.parsed.y}部电影`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 50
                    },
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)'
                    }
                },
                x: {
                    grid: {
                        display: false
                    }
                }
            },
            interaction: {
                intersect: false,
                mode: 'index'
            },
            animation: {
                duration: 1500,
                easing: 'easeOutQuart'
            }
        }
    });
}

// 更新图表数据
function updateChart(type) {
    showLoadingState();
    
    setTimeout(() => {
        if (type === 'category') {
            // 随机更新分类数据
            const updatedCategories = mockData.categories.map(cat => ({
                ...cat,
                film_count: Math.floor(cat.film_count * (0.9 + Math.random() * 0.2))
            }));
            createCategoryChart(updatedCategories);
        } else if (type === 'rating') {
            // 随机更新评分数据
            const updatedRatings = mockData.ratings.map(rating => ({
                ...rating,
                count: Math.floor(rating.count * (0.8 + Math.random() * 0.4))
            }));
            createRatingChart(updatedRatings);
        }
        
        hideLoadingState();
        showNotification('图表数据已更新', 'success');
    }, 800);
}

// 更新趋势图表
function updateTrendChart() {
    const months = parseInt(document.getElementById('monthRange').value);
    const allMonths = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    
    // 生成对应月份的数据
    const trendData = [];
    const currentMonth = new Date().getMonth();
    
    for (let i = months - 1; i >= 0; i--) {
        const monthIndex = (currentMonth - i + 12) % 12;
        trendData.push({
            month: allMonths[monthIndex],
            count: Math.floor(80 + Math.random() * 120)
        });
    }
    
    createTrendChart(trendData);
}

// 显示加载状态
function showLoadingState() {
    document.querySelectorAll('.card').forEach(card => {
        card.style.opacity = '0.7';
    });
}

// 隐藏加载状态
function hideLoadingState() {
    document.querySelectorAll('.card').forEach(card => {
        card.style.opacity = '1';
    });
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    // 初始化图表
    getChartData();
    
    // 添加卡片悬停效果
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-3px)';
            this.style.boxShadow = '0 12px 30px rgba(0,0,0,0.1)';
        });
        
        card.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
            this.style.boxShadow = '';
        });
    });
});
</script>
{% endblock %}
