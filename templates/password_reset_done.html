{% extends 'base.html' %}

{% block title %}密码重置邮件已发送 - 电影推荐系统{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card mt-5">
                <div class="card-header bg-success text-white">
                    <h4 class="text-center mb-0"><i class="fa fa-check-circle"></i> 邮件已发送</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fa fa-envelope-o fa-3x text-success mb-3"></i>
                        <h5 class="mb-3">密码重置邮件已发送</h5>
                        <p class="text-muted">
                            我们已经向您的邮箱发送了密码重置链接，请查收邮件并按照指示操作。
                            链接将在24小时内过期。
                        </p>
                    </div>
                    
                    <div class="alert alert-info">
                        <p class="mb-0">
                            <i class="fa fa-info-circle"></i>
                            如果您没有收到邮件，请检查垃圾邮件文件夹或重新请求密码重置。
                        </p>
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                            <i class="fa fa-sign-in"></i> 返回登录
                        </a>
                        <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary">
                            <i class="fa fa-refresh"></i> 重新发送邮件
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
