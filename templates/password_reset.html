{% extends 'base.html' %}

{% block title %}密码重置 - 电影推荐系统{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card mt-5">
                <div class="card-header">
                    <h4 class="text-center mb-0"><i class="fa fa-envelope"></i> 密码重置</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <p class="text-muted">
                                请输入您的注册邮箱，我们将发送密码重置链接到您的邮箱。
                            </p>
                        </div>
                        
                        {% if form.errors %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <strong>错误！</strong> 请检查您输入的邮箱是否正确。
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}
                        
                        <div class="mb-3">
                            <label for="id_email" class="form-label">注册邮箱</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="id_email" name="email" placeholder="请输入您的邮箱" required>
                            </div>
                            {% if form.email.errors %}
                            <div class="text-danger small mt-1">
                                {{ form.email.errors }}
                            </div>
                            {% endif %}
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fa fa-send"></i> 发送重置链接
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <a href="{% url 'login' %}" class="text-decoration-none">返回登录</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
