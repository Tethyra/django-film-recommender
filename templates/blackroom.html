{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0"><i class="fa fa-lock"></i> Blackroom</h5>
        </div>
        <div class="card-body text-center">
            <div class="mb-4">
                <i class="fa fa-lock fa-5x text-muted"></i>
            </div>
            <h2 class="mb-4">Blackroom</h2>
            <p class="text-muted mb-4">
                Blackroom是一个特殊的区域，这里包含一些限制级内容或独家内容。
                访问需要特殊权限或满足特定条件。
            </p>
            
            {% if user.is_authenticated %}
                <div class="alert alert-info mb-4">
                    <h5><i class="fa fa-info-circle"></i> 访问条件</h5>
                    <ul class="text-left mt-2">
                        <li>用户等级达到VIP</li>
                        <li>账号注册时间超过30天</li>
                        <li>累计评论超过50条</li>
                        <li>账号无违规记录</li>
                    </ul>
                </div>
                
                <div class="mb-4">
                    <button class="btn btn-primary" disabled>
                        <i class="fa fa-unlock"></i> 申请访问 (功能开发中)
                    </button>
                </div>
            {% else %}
                <a href="{% url 'login' %}?next={% url 'blackroom' %}" class="btn btn-primary">
                    <i class="fa fa-sign-in"></i> 登录查看
                </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
