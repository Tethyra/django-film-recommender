{% extends 'base.html' %}

{% block title %}登录 - 电影推荐系统{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card mt-5">
                <div class="card-header">
                    <h4 class="text-center mb-0"><i class="fa fa-sign-in"></i> 用户登录</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <strong>登录失败！</strong> 用户名或密码错误，请重试。
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">用户名</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa fa-bullseye"></i>
                                </span>
                                <input type="text" class="form-control" id="id_username" name="username" placeholder="请输入用户名" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="id_password" name="password" placeholder="请输入密码" required>
                            </div>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="id_remember">
                            <label class="form-check-label" for="id_remember">记住我</label>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fa fa-sign-in"></i> 登录
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <a href="{% url 'password_reset' %}" class="text-decoration-none">忘记密码？</a>
                        </div>
                        
                        <div class="text-center mt-3">
                            <span>还没有账号？</span>
                            <a href="{% url 'register' %}" class="text-decoration-none">立即注册</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    // 添加表单验证
    $('form').submit(function(e) {
        var username = $('#id_username').val().trim();
        var password = $('#id_password').val().trim();
        
        if (!username || !password) {
            alert('请填写完整的用户名和密码！');
            e.preventDefault();
            return false;
        }
        
        return true;
    });
    
    // 添加密码显示/隐藏功能
    $('#id_password').after('<button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="togglePassword">显示密码</button>');
    
    $('#togglePassword').on('click', function() {
        var passwordField = $('#id_password');
        var type = passwordField.attr('type') === 'password' ? 'text' : 'password';
        passwordField.attr('type', type);
        $(this).text(type === 'password' ? '显示密码' : '隐藏密码');
    });
});
</script>
{% endblock %}
