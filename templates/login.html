{% extends 'base.html' %}

{% block title %}登录 - 影视推荐系统{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header">
                    <h4 class="text-center">用户登录</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                        <div class="alert alert-danger">
                            用户名或密码不正确，请重试。
                        </div>
                        {% endif %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">用户名</label>
                            <input type="text" name="username" id="id_username" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">密码</label>
                            <input type="password" name="password" id="id_password" class="form-control" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">登录</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p>还没有账号？<a href="{% url 'register' %}">立即注册</a></p>
                        <p><a href="{% url 'password_reset' %}">忘记密码？</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
