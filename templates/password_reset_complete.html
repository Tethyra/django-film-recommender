{% extends 'base.html' %}

{% block title %}密码重置成功 - 电影推荐系统{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card mt-5">
                <div class="card-header bg-success text-white">
                    <h4 class="text-center mb-0"><i class="fa fa-check-circle"></i> 密码重置成功</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fa fa-check-circle-o fa-3x text-success mb-3"></i>
                        <h5 class="mb-3">您的密码已成功重置</h5>
                        <p class="text-muted">
                            您的密码已经成功更新。现在您可以使用新密码登录系统了。
                        </p>
                    </div>
                    
                    <div class="alert alert-success">
                        <p class="mb-0">
                            <i class="fa fa-info-circle"></i>
                            为了您的账号安全，建议定期更改密码。
                        </p>
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                            <i class="fa fa-sign-in"></i> 立即登录
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
