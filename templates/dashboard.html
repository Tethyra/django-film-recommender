{% extends 'base.html' %}

{% block title %}数据可视化 - 影视推荐系统{% endblock %}

{% block extra_css %}
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
    .chart-container {
        position: relative;
        height: 400px;
        margin-bottom: 2rem;
    }
    
    .stats-card {
        transition: all 0.3s ease;
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    
    .stats-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    
    .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
    }
    
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .fade-in {
        animation: fadeIn 0.6s ease-out;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-gradient bg-primary text-white">
            <h5 class="mb-0">
                <i class="fas fa-chart-bar mr-2"></i>
                数据可视化仪表板
            </h5>
        </div>
        <div class="card-body">
            <p class="text-muted mb-4">
                实时展示系统数据统计和分析结果
            </p>
            
            <!-- 核心统计指标 -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card stats-card bg-primary text-white">
                        <div class="card-body text-center">
                            <i class="fas fa-film text-3xl mb-2"></i>
                            <h6 class="card-title">影视作品总数</h6>
                            <p class="card-text display-4 font-bold" id="total-films">--</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card bg-success text-white">
                        <div class="card-body text-center">
                            <i class="fas fa-users text-3xl mb-2"></i>
                            <h6 class="card-title">注册用户数</h6>
                            <p class="card-text display-4 font-bold" id="total-users">--</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card bg-warning text-white">
                        <div class="card-body text-center">
                            <i class="fas fa-comments text-3xl mb-2"></i>
                            <h6 class="card-title">评论总数</h6>
                            <p class="card-text display-4 font-bold" id="total-reviews">--</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stats-card bg-purple text-white">
                        <div class="card-body text-center">
                            <i class="fas fa-star text-3xl mb-2"></i>
                            <h6 class="card-title">平均评分</h6>
                            <p class="card-text display-4 font-bold" id="avg-rating">--</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 图表区域 -->
            <div class="row">
                <!-- 分类分布饼图 -->
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h6 class="mb-0">
                                <i class="fas fa-chart-pie mr-2"></i>
                                电影分类分布
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="categoryChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 评分分布柱状图 -->
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h6 class="mb-0">
                                <i class="fas fa-chart-bar mr-2"></i>
                                用户评分分布
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="ratingChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row mt-4">
                <!-- 热门电影排行 -->
                <div class="col-md-12">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h6 class="mb-0">
                                <i class="fas fa-trophy mr-2"></i>
                                热门电影排行榜 (Top 10)
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="popularFilmsChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 模拟数据 - 在实际环境中应该从服务器获取
    const mockData = {
        totalFilms: 128,
        totalUsers: 543,
        totalReviews: 2341,
        avgRating: 3.8,
        categories: {
            labels: ['动作', '喜剧', '爱情', '科幻', '悬疑', '恐怖'],
            data: [25, 20, 18, 15, 12, 10]
        },
        ratings: {
            labels: ['1星', '2星', '3星', '4星', '5星'],
            data: [120, 280, 650, 890, 401]
        },
        popularFilms: {
            labels: ['10号舱里的女人', '365 dni', '刺客信条', '伏都鬼债', '疯狂飞车', 'Frankenstein', 'Gabby's Dollhouse', 'Diamanti', 'Diciannove', 'E poi si vede'],
            data: [4.8, 4.6, 4.5, 4.4, 4.3, 4.2, 4.1, 4.0, 3.9, 3.8]
        }
    };
    
    // 初始化页面
    document.addEventListener('DOMContentLoaded', function() {
        // 显示加载状态
        showLoadingState();
        
        // 模拟数据加载延迟
        setTimeout(function() {
            updateStats();
            createCategoryChart();
            createRatingChart();
            createPopularFilmsChart();
            hideLoadingState();
        }, 1000);
    });
    
    function showLoadingState() {
        const statsElements = document.querySelectorAll('#total-films, #total-users, #total-reviews, #avg-rating');
        statsElements.forEach(el => {
            el.innerHTML = '<div class="spinner" style="width: 20px; height: 20px;"></div>';
        });
    }
    
    function hideLoadingState() {
        // 添加淡入动画
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, index) => {
            setTimeout(() => {
                card.classList.add('fade-in');
            }, index * 100);
        });
    }
    
    function updateStats() {
        document.getElementById('total-films').textContent = mockData.totalFilms;
        document.getElementById('total-users').textContent = mockData.totalUsers;
        document.getElementById('total-reviews').textContent = mockData.totalReviews;
        document.getElementById('avg-rating').textContent = mockData.avgRating.toFixed(1);
    }
    
    function createCategoryChart() {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: mockData.categories.labels,
                datasets: [{
                    data: mockData.categories.data,
                    backgroundColor: [
                        '#667eea',
                        '#764ba2',
                        '#f093fb',
                        '#f5576c',
                        '#4facfe',
                        '#00f2fe'
                    ],
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 20,
                            usePointStyle: true
                        }
                    }
                }
            }
        });
    }
    
    function createRatingChart() {
        const ctx = document.getElementById('ratingChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: mockData.ratings.labels,
                datasets: [{
                    label: '评论数量',
                    data: mockData.ratings.data,
                    backgroundColor: '#667eea',
                    borderColor: '#5a67d8',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#f3f4f6'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    }
    
    function createPopularFilmsChart() {
        const ctx = document.getElementById('popularFilmsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: mockData.popularFilms.labels,
                datasets: [{
                    label: '评分',
                    data: mockData.popularFilms.data,
                    backgroundColor: '#43e97b',
                    borderColor: '#38f9d7',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        max: 5,
                        grid: {
                            color: '#f3f4f6'
                        }
                    },
                    y: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    }
    
    // 添加错误处理
    window.onerror = function(message, source, lineno, colno, error) {
        console.error('JavaScript Error:', message);
        alert('图表加载失败，请刷新页面重试');
        return true;
    };
</script>
{% endblock %}
