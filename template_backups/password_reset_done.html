{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0 text-center"><i class="fa fa-envelope"></i> 邮件已发送</h5>
            </div>
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="fa fa-check-circle fa-3x text-success"></i>
                </div>
                <h2 class="mb-4">重置链接已发送</h2>
                <p class="text-muted mb-4">
                    我们已向您的邮箱发送了密码重置链接，请查收邮件并按照指示操作。
                    如果您没有收到邮件，请检查垃圾邮件文件夹或重新尝试。
                </p>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary">返回登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
