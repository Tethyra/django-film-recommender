{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0 text-center"><i class="fa fa-lock"></i> 重置密码</h5>
            </div>
            <div class="card-body">
                <h2 class="text-center mb-4">忘记密码？</h2>
                <p class="text-center text-muted mb-4">请输入您的邮箱地址，我们将发送密码重置链接</p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label">邮箱地址</label>
                        {{ form.email }}
                        {% if form.email.errors %}
                            <div class="text-danger">{{ form.email.errors }}</div>
                        {% endif %}
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">发送重置链接</button>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}" class="text-primary">返回登录</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
